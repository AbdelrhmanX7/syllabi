[package]
name = "ka-study"
version = "0.1.8"
description = "Study — personal study app (Tauri 2 Android shell)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ka_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The shell is deliberately thin: the frontend is a static export bundled into the APK and talks
# to the backend over HTTPS; notes live in the WebView's IndexedDB. No sidecar, no updater, no
# recorder plugin — the Android build only needs the core runtime (plus `devtools` so the WebView
# inspector works on a release build for on-device diagnosis).
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YouTube captions fetched on the tablet (src/youtube_captions.rs). ureq 2 is a small blocking client
# whose `tls` feature is rustls + ring + bundled webpki roots: pure Rust (ring's C is built by the
# NDK clang tauri-cli already configures), no OpenSSL, no platform-verifier JNI — unlike reqwest's
# `rustls` feature (aws-lc-rs + cmake), which does not cross-compile cleanly for Android.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip", "json"] }
# Sign-in links: emailed https://app.syllabi.studio/auth/{magic,verify,reset}/ links (verified Android App
# Links, see public/.well-known/assetlinks.json) and the `studio.syllabi.app://auth` return from Google
# open the app instead of the browser. The page reads them via `plugin:deep-link|get_current` and the
# `deep-link://new-url` event (features/auth/components/DeepLinkRouter.tsx).
# Pinned to the last releases that work with tauri 2.11 (2.5+/2.6+ need tauri 2.12).
tauri-plugin-deep-link = "~2.4.10"
# Opens Google sign-in in the system browser (Google refuses sign-in inside an embedded WebView).
tauri-plugin-opener = "~2.5.5"
# Reminders scheduled on the tablet (deadlines, flashcards, the student's own), fired by Android's alarm
# service with the app closed; no push server. Driven from the page (lib/reminders/notify.ts).
# Pinned to the last release that works with tauri 2.11 (2.5+ needs tauri 2.12).
tauri-plugin-notification = "~2.4.0"
